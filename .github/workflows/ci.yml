name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # CI에는 개발 서버가 없으므로 라우트 타입 생성(next typegen)까지 포함한 전체 검사
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
